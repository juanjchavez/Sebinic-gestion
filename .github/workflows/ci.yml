name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seminario_ci
          POSTGRES_USER: seminario_ci
          POSTGRES_PASSWORD: seminario_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Valores ficticios, solo para este pipeline de CI. No son secretos reales:
      # no se reutilizan en .env local ni en producción. Ver issue #14.
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost
      DB_NAME: seminario_ci
      DB_USER: seminario_ci
      DB_PASSWORD: seminario_ci
      DB_HOST: localhost
      DB_PORT: '5432'
      # Valor ficticio: CI no escribe adjuntos; solo hace falta que la variable exista.
      ADJUNTOS_ROOT: /tmp/seminario-adjuntos-ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django check (equivalente a "build")
        run: python manage.py check

      # Falla si hay cambios de modelos sin su migración correspondiente.
      - name: Verificar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Migrar una base vacía
        run: python manage.py migrate --noinput

      - name: Tests
        run: pytest -v
